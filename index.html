<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Матрица рисков</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        /* ------------------------------
           Градиентный фон
        ------------------------------ */
        body {
            margin: 0;
            font-family: "Inter", sans-serif;
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            min-height: 100vh;
            padding: 40px 0;
            color: #fff;
        }

        /* ------------------------------
           Контейнер таблицы
        ------------------------------ */
        .table-wrapper {
            width: 92%;
            max-width: 1280px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 18px;
            padding: 28px;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 40px rgba(0,0,0,0.25);
        }

        /* ------------------------------
           Кнопки
        ------------------------------ */
        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 12px;
            cursor: pointer;
            border: none;
            font-size: 14px;
            background: rgba(255,255,255,0.25);
            backdrop-filter: blur(10px);
            color: #fff;
            transition: 0.25s;
        }

        .btn:hover {
            background: rgba(255,255,255,0.4);
        }

        .btn-primary {
            background: rgba(0,0,0,0.45);
        }

        .btn-primary:hover {
            background: rgba(0,0,0,0.65);
        }

        .btn-danger {
            background: rgba(255,0,0,0.45);
        }

        .btn-danger:hover {
            background: rgba(255,0,0,0.65);
        }

        /* ------------------------------
           Таблица
        ------------------------------ */
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            border-radius: 16px;
            overflow: hidden;
        }

        th {
            background: rgba(0,0,0,0.35);
            padding: 16px 20px;
            font-size: 15px;
            text-align: left;
            font-weight: 600;
        }

        td {
            padding: 14px 20px;
            font-size: 14px;
            background: rgba(255,255,255,0.12);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        tr:nth-child(even) td {
            background: rgba(255,255,255,0.18);
        }

        tr:hover td {
            background: rgba(255,255,255,0.25);
            transition: 0.25s;
        }

        .editable {
            cursor: pointer;
        }

        .editable-input {
            width: 100%;
            padding: 6px 10px;
            border-radius: 8px;
            border: none;
            outline: none;
            background: rgba(255,255,255,0.7);
            color: #000;
        }

        /* ------------------------------
           Severity badges
        ------------------------------ */
        .severity-badge {
            padding: 4px 10px;
            border-radius: 8px;
            font-weight: 600;
            display: inline-block;
            color: #000;
        }

        .severity-low { background: #a8ffb2; }
        .severity-medium { background: #ffe9a8; }
        .severity-high { background: #ffc4a8; }
        .severity-critical { background: #ffa8a8; }

        /* ------------------------------
           Удаление
        ------------------------------ */
        .btn-delete {
            background: rgba(255,0,0,0.45);
            border-radius: 10px;
            padding: 6px 8px;
            cursor: pointer;
            border: none;
            color: #fff;
            transition: 0.25s;
        }

        .btn-delete:hover {
            background: rgba(255,0,0,0.7);
        }

        /* ------------------------------
           Модалка
        ------------------------------ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            display: none;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active {
            display: flex;
        }

        .modal {
            width: 500px;
            max-height: 90vh;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(14px);
            border-radius: 16px;
            padding: 24px;
            overflow-y: auto;
            box-shadow: 0 8px 40px rgba(0,0,0,0.25);
        }

        .modal-header {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 14px;
            display: flex;
            justify-content: space-between;
            color: #fff;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #fff;
        }

        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            color: #fff;
            margin-bottom: 6px;
            display: block;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            background: rgba(255,255,255,0.25);
            border: none;
            color: #fff;
            border-radius: 10px;
        }

        /* Popup удаления */
        #confirmPopup {
            display: none;
            background: rgba(255,255,255,0.25);
            backdrop-filter: blur(14px);
            padding: 22px;
            border-radius: 14px;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 6px 30px rgba(0,0,0,0.35);
        }
        #confirmPopup.active {
            display: block;
        }
    </style>
</head>

<body>

<div class="table-wrapper">

    <div class="btn-group">
        <button class="btn" onclick="syncWithGitHub()">🔄 Синхронизировать</button>
        <button class="btn-primary" onclick="openModal()">＋ Добавить риск</button>

        <button class="btn" onclick="saveToJSON()">💾 Экспорт JSON</button>
        <button class="btn" id="loadJSONBtn">📂 Импорт JSON</button>
        <input type="file" id="fileInput" style="display:none" accept="application/json">

        <button class="btn-danger" onclick="deleteSelected()">🗑 Массовое удаление</button>
    </div>

    <table>
        <thead>
        <tr>
            <th><input type="checkbox" onclick="toggleSelectAll(this)"></th>
            <th>Шаг</th>
            <th>Команды</th>
            <th>Основной риск</th>
            <th>R</th>
            <th>A</th>
            <th>Вероятн.</th>
            <th>Влияние</th>
            <th>Критичность</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody id="risksTableBody"></tbody>
    </table>

</div>

<!-- Модалка -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalOnOverlay(event)">
    <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header">
            <span>Добавить риск</span>
            <button class="close-btn" onclick="closeModal()">&times;</button>
        </div>

        <form id="riskForm" onsubmit="addRisk(event)">
            <div class="form-group">
                <label>Название сценария</label>
                <input type="text" id="scenarioName" required>
            </div>

            <div id="stepsContainer"></div>

            <button type="button" class="btn" onclick="addStep()">＋ Добавить шаг</button>

            <br><br>
            <button type="submit" class="btn-primary">Сохранить</button>
        </form>
    </div>
</div>

<!-- Popup удаления -->
<div id="confirmPopup">
    <p style="font-size:15px; margin-bottom:14px;">Удалить этот риск?</p>

    <button class="btn-danger" onclick="confirmDelete()">Удалить</button>
    <button class="btn" onclick="closeConfirm()">Отмена</button>
</div>

<script src="script.js"></script>
</body>
</html>

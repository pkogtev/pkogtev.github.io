<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Матрица рисков</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Интерфейсный шрифт -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            background: #f5f6fa;
            font-family: "Inter", sans-serif;
            color: #333;
        }

        /* Верхняя панель */
        .topbar {
            background: #2d2f7f;
            color: white;
            padding: 14px 28px;
            font-size: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        /* Контейнер */
        .container {
            width: 92%;
            max-width: 1400px;
            margin: 24px auto;
        }

        /* Панель кнопок */
        .actions {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
        }

        .btn {
            background: #ececf5;
            border: 1px solid #d8d8e8;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }

        .btn:hover {
            background: #dcdcf0;
        }

        .btn-primary {
            background: #2d2f7f;
            color: white;
            border: none;
        }

        .btn-primary:hover {
            background: #242668;
        }

        .btn-delete {
            background: #e74a4a;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-delete:hover {
            background: #c03939;
        }

        /* Таблица */
        .table-wrapper {
            background: white;
            border-radius: 12px;
            padding: 0;
            box-shadow: 0 1px 4px rgba(0,0,0,0.07);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #fafafb;
            padding: 14px 18px;
            text-align: left;
            font-size: 14px;
            font-weight: 600;
            border-bottom: 1px solid #e5e5ef;
            color: #555;
        }

        td {
            padding: 13px 18px;
            border-bottom: 1px solid #ececf4;
            font-size: 14px;
        }

        tr:hover td {
            background: #f5f6ff;
        }

        .severity-badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
        }

        .severity-low { background: #e1f9e6; color: #0f7b1f; }
        .severity-medium { background: #fff4d4; color: #916c00; }
        .severity-high { background: #ffe1cf; color: #9c5224; }
        .severity-critical { background: #ffd2d2; color: #b02626; }

        /* Модалка */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            display: none;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            padding: 26px;
            border-radius: 10px;
            width: 420px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal h2 {
            margin-top: 0;
            font-size: 20px;
        }

        .modal .form-group {
            margin-bottom: 14px;
        }

        .modal label {
            display: block;
            margin-bottom: 4px;
            font-size: 13px;
            color: #666;
        }

        .modal input {
            width: 100%;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #d7d7e5;
        }
    </style>
</head>

<body>

    <div class="topbar">
        📊 Матрица рисков
    </div>

    <div class="container">
        <!-- КНОПКИ -->
        <div class="actions">
            <button class="btn" onclick="syncWithGitHub()">🔄 Синхронизировать</button>
            <button class="btn-primary" onclick="openModal()">＋ Добавить риск</button>
            <button class="btn" onclick="saveToJSON()">💾 Экспорт JSON</button>

            <button class="btn" id="loadJSONBtn">📂 Импорт JSON</button>
            <input type="file" id="fileInput" style="display:none">
        </div>

        <!-- ТАБЛИЦА -->
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th></th>
                        <th>Шаг</th>
                        <th>Команды</th>
                        <th>Основной риск</th>
                        <th>R</th>
                        <th>A</th>
                        <th>Вероятн.</th>
                        <th>Влияние</th>
                        <th>Критичность</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="risksTableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModalOnOverlay(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <h2>Добавить риск</h2>

            <form id="riskForm" onsubmit="addRisk(event)">
                <div class="form-group">
                    <label>Название сценария</label>
                    <input type="text" id="scenarioName" required>
                </div>

                <div id="stepsContainer"></div>

                <button type="button" class="btn" onclick="addStep()">＋ Добавить шаг</button>

                <br><br>

                <button type="submit" class="btn-primary">Сохранить</button>
                <button type="button" class="btn" onclick="closeModal()">Отмена</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

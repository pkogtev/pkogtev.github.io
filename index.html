<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Матрица рисков</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#f6f7fb; --card:#ffffff; --muted:#6b7280; --accent:#2563eb;
      --line:#e7eaf0; --danger:#ff6b6b;
    }
    *{box-sizing:border-box}
    body{
      margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;
      background:var(--bg); color:#1f2937;
      -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    }

    .wrap{max-width:1200px;margin:28px auto;padding:0 16px;}

    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
    header h1{font-size:20px;margin:0;font-weight:700}
    .controls{display:flex;gap:10px;flex-wrap:wrap}

    .btn{
      background:#eef2ff;border:1px solid var(--line);padding:10px 14px;border-radius:10px;
      color:var(--text);cursor:pointer;font-weight:600;
    }
    .btn-primary{
      background:var(--accent);color:white;border:none;padding:10px 16px;border-radius:12px;box-shadow:0 6px 18px rgba(37,99,235,0.14)
    }
    .btn-ghost{background:transparent;border:1px solid var(--line);}

    /* table card */
    .card{background:var(--card);border-radius:14px;padding:8px;box-shadow:0 8px 30px rgba(16,24,40,0.06);overflow:auto}
    table{width:100%;border-collapse:collapse;min-width:860px}
    thead th{
      text-align:left;padding:14px 16px;font-weight:600;color:var(--muted);font-size:13px;
      border-bottom:1px solid var(--line);background:#fbfcff;position:sticky;top:0;z-index:1
    }
    tbody td{padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:14px;color:#111827}
    tbody tr:hover td{background:#fbfdff}

    /* checkbox */
    input[type="checkbox"]{width:16px;height:16px;accent-color:var(--accent);}

    /* severity */
    .severity-badge{padding:6px 10px;border-radius:8px;font-weight:700;font-size:13px;display:inline-block}
    .sev-low{background:#e6f8ec;color:#0b7a2a}
    .sev-med{background:#fff7e6;color:#a77a00}
    .sev-high{background:#fff0ef;color:#c24135}
    .sev-crit{background:#ffecec;color:#b02626}

    /* actions inside cell */
    .actions{display:flex;gap:8px;opacity:0;transition:opacity .18s}
    tbody tr:hover .actions{opacity:1}
    .action-btn{width:40px;height:40px;border-radius:10px;border:none;background:#f3f6fb;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
    .action-btn:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(37,99,235,0.12)}

    /* responsive */
    @media (max-width:960px){
      table{min-width:720px}
      .wrap{padding:0 10px}
    }
    @media (max-width:720px){
      table{min-width:600px}
    }

    /* modal */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.36);display:none;align-items:center;justify-content:center;padding:20px}
    .modal-overlay.active{display:flex}
    .modal{width:100%;max-width:760px;background:white;border-radius:12px;padding:18px;box-shadow:0 16px 48px rgba(16,24,40,0.18);max-height:90vh;overflow:auto}
    .modal .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
    .modal h2{margin:0;font-size:18px}
    .close-btn{background:transparent;border:none;font-size:22px;cursor:pointer}
    .form-row{display:flex;gap:12px;align-items:center}
    .form-col{flex:1;min-width:0}
    .form-group{margin-bottom:10px}
    label{display:block;font-size:13px;color:#374151;margin-bottom:6px;font-weight:600}
    input[type="text"], input[type="number"], textarea, select{
      width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px
    }
    .steps{margin-top:12px}
    .step-card{border:1px solid var(--line);padding:12px;border-radius:10px;margin-bottom:10px;background:#fbfdff}
    .step-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
    .small-btn{background:#eef2ff;border:none;padding:6px 10px;border-radius:8px;cursor:pointer}

    .modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
    .note{font-size:13px;color:#6b7280}

    /* editable input */
    .editable-input{width:100%;padding:6px 8px;border-radius:8px;border:1px solid #d1d5db}
    .inline-edit{border-bottom:1px dashed #e5e7eb;padding:4px 6px;cursor:pointer}

    /* small screens - stacking controls */
    @media (max-width:640px){
      .form-row{flex-direction:column}
      .actions{gap:6px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Матрица рисков</h1>
      <div class="controls">
        <button class="btn btn-primary" id="btnAdd">+ Добавить сценарий</button>
        <button class="btn" id="btnExport">Экспорт JSON</button>
        <button class="btn" id="btnImport">Импорт JSON</button>
        <input type="file" id="fileInput" accept="application/json" style="display:none">
      </div>
    </header>

    <div class="card">
      <table role="table" aria-label="Risks table">
        <thead>
          <tr>
            <th style="width:36px"></th>
            <th>Сценарий</th>
            <th>Шаг пользователя</th>
            <th>Участвующие команды</th>
            <th>Основной риск</th>
            <th>R</th>
            <th>A</th>
            <th>Вероятность</th>
            <th>Влияние</th>
            <th>Критичность</th>
            <th style="width:120px">Действия</th>
          </tr>
        </thead>
        <tbody id="risksTableBody">
          <!-- rows inserted by script -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal: add/edit --> 
  <div class="modal-overlay" id="modalOverlay" onclick="closeModalOnOverlay(event)">
    <div class="modal" role="dialog" aria-modal="true" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h2 id="modalTitle">Добавить сценарий</h2>
        <button class="close-btn" onclick="closeModal()">✕</button>
      </div>

      <form id="scenarioForm" onsubmit="submitScenario(event)">

        <div class="form-group">
          <label for="scenarioName">Название сценария</label>
          <input type="text" id="scenarioName" required placeholder="Например: Онбординг нового пользователя">
        </div>

        <div class="form-group">
          <label>Шаги сценария (до 10)</label>
          <div class="steps" id="stepsContainer"></div>
          <div style="margin-top:8px">
            <button type="button" class="small-btn" id="addStepBtn">+ Добавить шаг</button>
            <span class="note" style="margin-left:12px">У каждого шага можно добавить несколько рисков</span>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn" onclick="closeModal()">Отмена</button>
          <button type="submit" class="btn btn-primary">Сохранить сценарий</button>
        </div>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>

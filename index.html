<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Матрица рисков — Минималистичный стиль</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Inter', sans-serif;
        background: #f5f6f7;
        color: #222;
        line-height: 1.5;
    }
    .header {
        background: #ffffff;
        border-bottom: 1px solid #e5e5e5;
        padding: 24px 32px;
    }
    .header-content {
        max-width: 1400px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        gap: 16px;
    }
    .header-icon { font-size: 40px; opacity: 0.7; }
    .header h1 { font-size: 28px; font-weight: 600; }
    .header-subtitle { margin-top: 4px; color: #666; font-size: 14px; }

    .container { max-width: 1400px; margin: 0 auto; padding: 24px; }

    .controls {
        background: #fff;
        border: 1px solid #e3e3e3;
        border-radius: 8px;
        padding: 18px;
        margin-bottom: 20px;
    }
    .controls-row {
        display: flex; flex-wrap: wrap;
        justify-content: space-between; align-items: center;
        gap: 12px;
    }
    .controls-left { display: flex; gap: 12px; flex-wrap: wrap; }

    .btn {
        padding: 10px 16px;
        border-radius: 6px;
        border: 1px solid #ccc;
        background: #fff;
        cursor: pointer;
        font-size: 14px;
        transition: 0.15s;
    }
    .btn:hover { background: #f0f0f0; }

    .btn-primary {
        font-weight: 600;
        border-color: #999;
    }
    .btn-success { border-color: #a3cfa3; }
    .btn-secondary { border-color: #aeb7c2; }
    .btn-danger { border-color: #d5a3a3; color: #b00; }

    input, select {
        padding: 10px 12px;
        border-radius: 6px;
        border: 1px solid #ccc;
        background: #fff;
        font-size: 14px;
    }

    .table-container { background: #fff; border:1px solid #e3e3e3; border-radius: 8px; overflow:hidden; }
    .table-wrapper { overflow-x:auto; }

    table { width:100%; border-collapse:collapse; }
    thead { background:#fafafa; border-bottom:1px solid #e3e3e3; }
    th { padding:14px; text-align:left; font-size:13px; color:#555; }
    td { padding:14px; border-bottom:1px solid #f1f1f1; }
    tr:hover td { background:#f9f9f9; }

    .scenario-row { background:#f3f4f5; font-weight:600; }
    .step-row td:first-child { padding-left:32px; }
    .editable:hover { background:#f2f2f2; }

    .criticality { padding:4px 10px; border-radius:6px; font-size:12px; font-weight:600; }
    .criticality-low { background:#e4f6e4; color:#2e7d32; }
    .criticality-medium { background:#fff4cc; color:#8a6d3b; }
    .criticality-high { background:#f8d7da; color:#842029; }
    .criticality-critical { background:#d9534f; color:#fff; }

    /* Modal */
    .modal-overlay {
        display:none; position:fixed; inset:0;
        background:rgba(0,0,0,0.25);
        align-items:center; justify-content:center;
    }
    .modal-overlay.active { display:flex; }

    .modal {
        background:#fff; border-radius:10px;
        padding:24px; width:90%; max-width:700px;
        border:1px solid #e3e3e3;
    }
    .modal-header { font-size:20px; font-weight:600; margin-bottom:16px; }
    .form-group { margin-bottom:16px; }
    .form-group label { display:block; margin-bottom:6px; font-weight:600; }

    .steps-container { margin-top:16px; }
    .step-item { background:#fafafa; border:1px solid #e3e3e3; padding:16px; border-radius:6px; margin-bottom:12px; }

    .btn-add-step { width:100%; padding:12px; border-radius:6px; border:1px dashed #aaa; background:#fff; font-weight:600; cursor:pointer; }
    .btn-add-step:hover { background:#f3f3f3; }
</style>
</head>
<body>
<div class="header">
    <div class="header-content">
        <div class="header-icon">🎯</div>
        <div>
            <h1>Матрица рисков</h1>
            <div class="header-subtitle">Управление и контроль рисков проекта</div>
        </div>
    </div>
</div>

<div class="container">

    <div class="controls">
        <div class="controls-row">
            <div class="controls-left">
                <button class="btn btn-primary" id="addScenarioBtn" onclick="openModal()">➕ Добавить сценарий</button>

                <input type="text" id="searchInput" placeholder="Поиск..." oninput="applyFilters()" />
                <select id="teamFilter" onchange="applyFilters()">
                    <option value="">Все команды</option>
                </select>
            </div>

            <div style="display:flex; gap:10px; flex-wrap:wrap;">
                <button class="btn btn-success" onclick="saveToFile()">JSON</button>
                <button class="btn btn-secondary" onclick="exportToCSV()">CSV</button>
                <input type="file" id="fileInput" accept=".json" style="display:none;" onchange="loadFromFile(event)" />
                <input type="file" id="csvInput" accept=".csv" style="display:none;" onchange="importFromCSV(event)" />
            </div>
        </div>
    </div>

    <div class="table-container">
        <div class="table-wrapper">
            <table id="risksTable">
                <thead>
                    <tr>
                        <th>Сценарий / Шаг пользователя</th>
                        <th>Участвующие команды</th>
                        <th>Критичность</th>
                        <th>Основной риск</th>
                        <th>R</th>
                        <th>A</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr>
                        <td colspan="7" style="padding:40px; text-align:center; color:#777;">Нет данных. Добавьте первый сценарий.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <div class="modal-header" id="modalTitle">Добавить сценарий</div>

        <div class="form-group">
            <label>Название сценария</label>
            <input type="text" id="scenarioName" />
        </div>

        <div class="steps-container">
            <label>Шаги сценария</label>
            <div id="stepsContainer"></div>
            <button class="btn-add-step" onclick="addStep()">➕ Добавить шаг</button>
        </div>

        <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px;">
            <button class="btn" onclick="closeModal()">Отмена</button>
            <button class="btn btn-success" onclick="saveScenario()">Сохранить</button>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>

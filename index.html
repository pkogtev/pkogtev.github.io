<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Матрица рисков</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        /* ============ GLOBAL ============ */

        body {
            margin: 0;
            font-family: Inter, system-ui, sans-serif;
            background: #f6f7f9;
            color: #2e2e2e;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin: 30px 40px 20px;
        }

        /* ============ ADD BUTTON ============ */

        .btn-add {
            margin: 0 40px 20px;
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 12px 28px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(37,99,235,0.25);
            transition: 0.25s;
        }
        .btn-add:hover {
            background: #1d4fd8;
            transform: translateY(-1px);
        }

        /* ============ WRAPPER ============ */

        .table-wrapper {
            width: 92%;
            margin: 0 auto 50px;
            background: #fff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.06);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        /* HEADER */

        thead {
            background: #f1f3f7;
        }

        thead th {
            padding: 16px 14px;
            font-weight: 600;
            font-size: 13.5px;
            color: #6b7280;
            text-align: left;
        }

        /* ROWS */

        tbody tr {
            transition: background 0.12s ease;
        }

        tbody tr:hover {
            background: #f9fbff;
        }

        tbody tr.selected {
            background: #e8f1ff !important;
        }

        tbody td {
            padding: 16px 14px;
            font-size: 15px;
            color: #1f2937;
            border-bottom: 1px solid #f0f2f5;
        }

        /* ============ CHECKBOX ============ */
        .row-check,
        thead input[type="checkbox"] {
            width: 17px;
            height: 17px;
            cursor: pointer;
            accent-color: #2563eb;
        }

        /* ============ SEVERITY BADGE ============ */

        .severity-badge {
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            display: inline-block;
        }

        .severity-low     { background: #e9fce9; color: #2f8f2f; }
        .severity-medium  { background: #fff7e6; color: #b88400; }
        .severity-high    { background: #ffe9e6; color: #d43b2c; }
        .severity-critical{ background: #ffdada; color: #c32020; }

        /* ============ ACTION BUTTONS ============ */

        .actions {
            display: flex;
            gap: 6px;
            opacity: 0;
            transition: 0.2s ease;
        }

        tbody tr:hover .actions {
            opacity: 1;
        }

        .btn-action,
        .btn-delete {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: #eef2ff;
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: 0.25s;
        }

        .btn-action:hover {
            background: #d9e1ff;
            transform: translateY(-1px);
        }

        .btn-delete {
            background: #f3f4f6;
        }

        .btn-delete:hover {
            background: #ffeaea;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255,60,60,0.25);
        }

        .btn-delete img,
        .btn-action img {
            width: 18px;
            opacity: 0.7;
        }

        tbody tr:hover img {
            opacity: 1;
        }

        /* ============ MODAL ============ */

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.35);
            display: none;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.25s ease forwards;
        }

        .modal-overlay.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        .modal {
            background: #fff;
            padding: 22px;
            width: 420px;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.15);
            animation: scaleIn 0.25s ease forwards;
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.9); }
            to   { opacity: 1; transform: scale(1); }
        }

        .modal h2 {
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            font-weight: 600;
            margin-bottom: 6px;
            display: block;
        }

        .form-group input {
            width: 100%;
            padding: 11px 12px;
            border-radius: 10px;
            border: 1px solid #dadde3;
        }

        .modal-footer {
            margin-top: 20px;
            text-align: right;
        }

        .btn-save {
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
        }

        .btn-cancel {
            background: #f1f1f3;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            margin-right: 8px;
            cursor: pointer;
        }

    </style>
</head>

<body>

    <h1>Матрица рисков</h1>

    <button class="btn-add" onclick="openModal()">+ Добавить риск</button>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th><input type="checkbox" onclick="toggleSelectAll(this)"></th>
                    <th>Шаг</th>
                    <th>Команды</th>
                    <th>Основной риск</th>
                    <th>R</th>
                    <th>A</th>
                    <th>Вероятность</th>
                    <th>Влияние</th>
                    <th>Критичность</th>
                    <th>Действия</th>
                </tr>
            </thead>

            <tbody id="risksTableBody"></tbody>
        </table>
    </div>

    <input id="fileInput" type="file" accept="application/json" hidden>

    <!-- MODAL -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModalOnOverlay(event)">
        <div class="modal">
            <h2 id="modalTitle">Добавить риск</h2>

            <div class="form-group">
                <label>Шаг</label>
                <input id="mStep">
            </div>

            <div class="form-group">
                <label>Команды</label>
                <input id="mTeams">
            </div>

            <div class="form-group">
                <label>Основной риск</label>
                <input id="mMainRisk">
            </div>

            <div class="form-group">
                <label>R</label>
                <input id="mR">
            </div>

            <div class="form-group">
                <label>A</label>
                <input id="mA">
            </div>

            <div class="form-group">
                <label>Вероятность</label>
                <input id="mProb" type="number" min="1" max="5">
            </div>

            <div class="form-group">
                <label>Влияние</label>
                <input id="mImpact" type="number" min="1" max="5">
            </div>

            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeModal()">Отмена</button>
                <button class="btn-save" onclick="saveRisk()">Сохранить</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>

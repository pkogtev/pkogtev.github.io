<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Матрица рисков — Styled</title>
<style>
/* ====== ONLY STYLE CHANGES (STRUCTURE UNTOUCHED) ====== */

body{
  margin:0;
  background:#f7f8f9;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color:#2b2f33;
  overflow-x:hidden;
}

/* HEADER */
.header{
  height:64px;
  background:#f1f6f5;
  border-bottom:1px solid rgba(0,0,0,0.05);
  display:flex;
  align-items:center;
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:50;
}
.logo-block{
  width:140px;
  height:64px;
  background:#7fb6b0;
  color:white;
  display:flex;
  align-items:center;
  padding-left:20px;
  font-weight:700;
  font-size:18px;
}
.header .search{
  margin-left:20px;
  flex:1;
  max-width:600px;
}
.header .search input{
  width:100%;
  padding:10px 14px;
  border-radius:8px;
  border:1px solid rgba(0,0,0,0.06);
  background:white;
  font-size:14px;
}

/* SIDEBAR */
.sidebar{
  width:240px;
  background:#24363b;
  color:#cfd9d9;
  height:100vh;
  position:fixed;
  top:64px;
  left:0;
  transform:translateX(-260px);
  transition:0.3s;
  padding:22px 18px;
  z-index:60;
}
.sidebar.open{transform:translateX(0);}
.menu-item{
  padding:10px 14px;
  border-radius:8px;
  cursor:pointer;
  margin-bottom:6px;
}
.menu-item:hover{background:rgba(255,255,255,0.05);color:white;}
.menu-item.active{background:rgba(255,255,255,0.08);color:white;}

/* MAIN */
.main{
  margin-top:64px;
  padding:28px 36px;
  transition:margin-left .3s;
}
.body-sidebar-open .main{margin-left:240px;}

/* (+) BUTTON */
.add-scn-button{
  width:40px;height:40px;border-radius:10px;border:none;
  background:#eef3f2;
  font-size:22px;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  margin-bottom:16px;
}

/* CONTROLS */
.controls{display:flex;justify-content:space-between;margin-bottom:16px;}
.controls input, .controls select{
  padding:10px 12px;
  border-radius:8px;
  border:1px solid rgba(0,0,0,0.08);
  background:white;
}

/* TABLE */
.table-container{
  background:white;
  border-radius:8px;
  border:1px solid rgba(0,0,0,0.04);
}
table{width:100%;border-collapse:collapse;}
thead th{
  font-size:12px;
  padding:16px;
  background:white;
  color:#9aa5a5;
  border-bottom:1px solid rgba(0,0,0,0.05);
  text-transform:uppercase;
}
tbody td{
  padding:18px;
  border-bottom:1px solid rgba(0,0,0,0.04);
  color:#6f7a7a;
  font-size:14px;
}
tbody tr:hover{background:rgba(0,0,0,0.02);}
.scenario-row td{font-weight:700;color:#2b3335;}

/* MODAL */
.modal-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.5);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:200;
}
.modal-overlay.active{display:flex;}
.modal{
  width:90%;max-width:880px;
  background:white;
  border-radius:10px;
  overflow:hidden;
}
.modal-header{
  padding:20px;
  border-bottom:1px solid rgba(0,0,0,0.06);
  font-size:20px;
  font-weight:700;
}
.modal-body{padding:20px;}
.modal-footer{
  padding:14px;
  border-top:1px solid rgba(0,0,0,0.06);
  display:flex;justify-content:flex-end;gap:10px;
}
button{cursor:pointer;}

</style>
</head>
<body>
<div class="header">
  <div class="logo-block">Матрица рисков</div>
  <div class="search"><input id="searchInput" placeholder="Search..." /></div>
</div>

<div class="sidebar" id="sidebar">
  <button id="sidebarClose" style="width:32px;height:32px;border:none;border-radius:8px;background:#1c2a2e;color:white;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-bottom:16px;">✕</button>
  <div class="menu-item active">Матрица рисков</div>
      <div class="menu-item" onclick="toggleExportDropdown()">Экспорт</div>
      <div class="menu-item" onclick="toggleImportDropdown()">Импорт</div>
  <div class="menu-item">RACI</div>
  <div class="menu-item">MIRO</div>
  <div class="menu-item">Графики</div>
</div>

<div class="main" id="mainContent">
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;margin-top:10px;height:40px;align-items:center;">
    <button id="sidebarToggle" style="width:40px;height:40px;border:none;border-radius:10px;background:#24363b;color:white;cursor:pointer;display:flex;align-items:center;justify-content:center;">☰</button>
    <button class="add-scn-button" style="margin:0;">+</button>
  </div>

  <div class="controls">
    <div style="display:flex;gap:10px;align-items:center;">
      <input id="searchInput2" placeholder="Поиск сценария..." oninput="applyFilters()">
      <select id="teamFilter" onchange="applyFilters()"><option value="">Все команды</option></select>
    </div>
    <div style="display:none;"></div>
  </div>

  <div class="table-container">
    <div class="table-wrapper">
      <table id="risksTable">
        <thead>
          <tr>
            <th>Сценарий / Шаг пользователя</th>
            <th>Участвующие команды</th>
            <th>Критичность</th>
            <th>Основной риск</th>
            <th>R</th>
            <th>A</th>
            <th id="actionsHeader">Действия</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
<!-- HAMBURGER BUTTON TO OPEN SIDEBAR -->

</div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header"><span id="modalTitle">Добавить сценарий</span></div>
    <div class="modal-body">
      <label>Название сценария *</label>
      <input id="scenarioName" style="width:100%;padding:10px;margin-bottom:14px;border-radius:8px;border:1px solid rgba(0,0,0,0.08);">
      <div id="stepsContainer"></div>
      <button onclick="addStep()">➕ Добавить шаг</button>
    </div>
    <div class="modal-footer">
      <button onclick="closeModal()">Отмена</button>
      <button onclick="saveScenario()">Сохранить</button>
    </div>
  </div>
</div>

<script>

</script>
</body>
</html>

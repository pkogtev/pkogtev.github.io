<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Матрица рисков</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: "Inter", sans-serif;
            background: #f5f7fb;
            margin: 0;
            padding: 40px;
            color: #333;
        }

        .wrapper {
            max-width: 1500px;
            margin: 0 auto;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 25px;
            color: #2c3e50;
        }

        /* Панель кнопок */
        .top-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }

        .btn-primary {
            padding: 12px 22px;
            background: #2d7ff9;
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(45, 127, 249, 0.25);
            cursor: pointer;
            transition: 0.25s ease;
        }

        .btn-primary:hover {
            background: #1f6fe0;
            transform: translateY(-2px);
        }

        .table-container {
            background: white;
            border-radius: 22px;
            padding: 10px 0 0 0;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            border-spacing: 0;
        }

        thead {
            background: #eef3fb;
        }

        thead th {
            text-align: left;
            font-size: 15px;
            font-weight: 600;
            padding: 18px 24px;
            color: #6b7280;
        }

        tbody tr {
            background: white;
            transition: 0.2s;
        }

        tbody tr:hover {
            background: #f8faff;
        }

        tbody td {
            padding: 18px 24px;
            font-size: 15px;
            vertical-align: middle;
            color: #444;
            border-bottom: 1px solid #f0f0f0;
        }

        /* Кнопки действий */
        .actions {
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0;
            transition: 0.2s ease;
        }

        tbody tr:hover .actions {
            opacity: 1;
        }

        .btn-action,
        .btn-delete {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: none;
            cursor: pointer;
            transition: 0.25s;
        }

        .btn-action {
            background: #eef2f7;
        }
        .btn-action:hover {
            background: #e2e8f0;
            transform: translateY(-2px);
        }

        .btn-delete {
            background: #f2f3f5;
        }
        .btn-delete:hover {
            background: #ffeaea;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(255, 80, 80, 0.18);
        }

        .btn-action img, .btn-delete img {
            width: 18px;
            opacity: 0.75;
            transition: 0.2s;
        }
        .btn-action:hover img, .btn-delete:hover img {
            opacity: 1;
        }

        td:last-child {
            width: 130px;
        }
    </style>

</head>

<body>
    <div class="wrapper">
        <h1>Матрица рисков</h1>

        <div class="top-bar">
            <button class="btn-primary" onclick="openModal()">Добавить риск</button>
        </div>

        <div class="table-container">
            <table id="riskTable">
                <thead>
                    <tr>
                        <th>Шаг</th>
                        <th>Команды</th>
                        <th>Основной риск</th>
                        <th>R</th>
                        <th>A</th>
                        <th>Вероятность</th>
                        <th>Влияние</th>
                        <th>Критичность</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="riskTableBody">
                    <!-- JS вставит строки -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Матрица рисков</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Inter, system-ui, sans-serif;
            background: #f5f7fb;
            color: #333;
        }

        h1 {
            font-size: 28px;
            margin: 20px 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
        }

        /* Контейнер таблицы */
        .table-wrapper {
            background: white;
            margin: 20px auto;
            width: 95%;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.07);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 15px;
        }

        thead {
            background: #e9f0ff;
        }

        thead th {
            padding: 16px 12px;
            font-weight: 600;
            color: #444;
            text-align: left;
        }

        tbody tr {
            border-bottom: 1px solid #eef1f5;
            transition: background 0.12s;
        }

        tbody tr:hover {
            background: #f8fbff;
        }

        tbody td {
            padding: 14px 12px;
        }

        /* Кнопка – Добавить риск */
        .btn-add {
            margin: 20px 30px;
            background: #2d72d9;
            color: white;
            padding: 12px 28px;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            box-shadow: 0 4px 10px rgba(45,114,217,0.25);
            transition: 0.25s ease;
        }

        .btn-add:hover {
            background: #2465c2;
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(45,114,217,0.35);
        }

        /* Кнопки действия */

        .btn-action {
            background: #eef3ff;
            width: 46px;
            height: 46px;
            border-radius: 14px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            border: none;
            cursor: pointer;
            margin-right: 8px;
            transition: 0.25s ease;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        .btn-action:hover {
            background: #dbe7ff;
            transform: translateY(-2px);
        }

        .btn-action img {
            width: 18px;
            opacity: 0.8;
        }


        /* Кнопка Удалить */
        .btn-delete {
            background: #f4f4f4;
            width: 46px;
            height: 46px;
            border-radius: 14px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            border: none;
            cursor: pointer;
            transition: 0.25s ease;
            box-shadow: 0 2px 6px rgba(0,0,0,0.07);
        }

        .btn-delete:hover {
            background: #ffe6e6;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(255,80,80,0.25);
        }

        .btn-delete img {
            width: 20px;
            opacity: 0.8;
        }

        .btn-delete:hover img {
            opacity: 1;
        }

        /* Модалка */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.35);
            display: none;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            padding: 25px;
            width: 420px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .modal h2 {
            margin-top: 0;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            font-weight: 600;
            display: block;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid #d8dde6;
            font-size: 14px;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 20px;
        }

        .btn {
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            border: none;
        }

        .btn-cancel {
            background: #eceff4;
        }

        .btn-save {
            background: #2d72d9;
            color: white;
        }

    </style>
</head>
<body>

    <h1>📊 Матрица рисков</h1>

    <button class="btn-add" onclick="openModal()">+ Добавить риск</button>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th><input type="checkbox" onclick="toggleSelectAll(this)"></th>
                    <th>Шаг</th>
                    <th>Команды</th>
                    <th>Основной риск</th>
                    <th>R</th>
                    <th>A</th>
                    <th>Вероятность</th>
                    <th>Влияние</th>
                    <th>Критичность</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody id="risksTableBody"></tbody>
        </table>
    </div>

    <input id="fileInput" type="file" accept="application/json" hidden>

    <!-- Модалка -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModalOnOverlay(event)">
        <div class="modal">
            <h2 id="modalTitle">Добавить риск</h2>

            <div class="form-group">
                <label>Шаг</label>
                <input id="mStep">
            </div>

            <div class="form-group">
                <label>Команды</label>
                <input id="mTeams">
            </div>

            <div class="form-group">
                <label>Основной риск</label>
                <input id="mMainRisk">
            </div>

            <div class="form-group">
                <label>R</label>
                <input id="mR">
            </div>

            <div class="form-group">
                <label>A</label>
                <input id="mA">
            </div>

            <div class="form-group">
                <label>Вероятность</label>
                <input id="mProb" type="number" min="1" max="5">
            </div>

            <div class="form-group">
                <label>Влияние</label>
                <input id="mImpact" type="number" min="1" max="5">
            </div>

            <div class="modal-footer">
                <button class="btn btn-cancel" onclick="closeModal()">Отмена</button>
                <button class="btn btn-save" onclick="saveRisk()">Сохранить</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>

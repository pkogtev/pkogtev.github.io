<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Матрица рисков</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

           body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background: #F4F5F7;
        color: #1A1A1D;
        line-height: 1.6;
    }

    .container {
        max-width: 1600px;
        margin: 0 auto;
        padding: 30px;
    }

    .controls {
        background: white;
        padding: 25px;
        border-radius: 16px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        margin-bottom: 25px;
        border: 1px solid #e9ecef;
    }

    .controls-row {
        display: flex;
        flex-wrap: wrap;
        gap: 15px;
        align-items: center;
        justify-content: space-between;
    }

    .controls-left {
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
        flex: 1;
    }

    .btn {
        padding: 12px 24px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        transition: all 0.3s ease;
        white-space: nowrap;
        display: inline-flex;
        align-items: center;
        gap: 8px;
    }

    .btn-primary {
        background: #1A1A1D;
        color: white;
    }

    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(26, 26, 29, 0.4);
    }

    .btn-success {
        background: #C6FF3D;
        color: #1A1A1D;
    }

    .btn-success:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(198, 255, 61, 0.4);
    }

    .btn-secondary {
        background: #8B8C8F;
        color: white;
    }

    .btn-secondary:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(139, 140, 143, 0.4);
    }

    .btn-danger {
        background: #ff4757;
        color: white;
        padding: 8px 16px;
        font-size: 13px;
    }

    .btn-danger:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(255, 71, 87, 0.4);
    }

    .btn-edit {
        background: #ffa502;
        color: white;
        padding: 8px 16px;
        font-size: 13px;
        margin-right: 5px;
    }

    .btn-edit:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(255, 165, 2, 0.4);
    }

    .input-group {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
    }

    input[type="text"],
    input[type="number"],
    select,
    textarea {
        padding: 12px 16px;
        border: 2px solid #e9ecef;
        border-radius: 10px;
        font-size: 14px;
        transition: all 0.3s ease;
        min-width: 200px;
        background: white;
    }

    input[type="text"]:focus,
    input[type="number"]:focus,
    select:focus,
    textarea:focus {
        outline: none;
        border-color: #C6FF3D;
        box-shadow: 0 0 0 3px rgba(198, 255, 61, 0.1);
    }

    .table-container {
        background: white;
        border-radius: 16px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        overflow: hidden;
        border: 1px solid #e9ecef;
    }

    .table-wrapper {
        overflow-x: auto;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        min-width: 1000px;
    }

    thead {
        background: #1A1A1D;
        color: white;
    }

    th {
        padding: 18px 16px;
        text-align: left;
        font-weight: 600;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        border-bottom: 3px solid rgba(255,255,255,0.1);
    }

    td {
        padding: 16px;
        border-bottom: 1px solid #f1f3f5;
        font-size: 14px;
        color: #495057;
    }

    tbody tr {
        transition: all 0.2s ease;
    }

    tbody tr:hover {
        background: #f8f9fa;
        transform: scale(1.001);
    }

    .scenario-row {
        background: #e9ecef;
        font-weight: 700;
        color: #1A1A1D;
    }

    .scenario-row td {
        padding: 16px;
        font-size: 15px;
        border-bottom: 2px solid #adb5bd;
    }

    .scenario-row:hover {
        background: #dee2e6;
    }

    .step-row td:first-child {
        padding-left: 50px;
        position: relative;
    }

    .step-row td:first-child::before {
        content: '└';
        position: absolute;
        left: 30px;
        color: #adb5bd;
        font-weight: bold;
    }

    .editable {
        cursor: pointer;
        position: relative;
        min-height: 20px;
        border-radius: 6px;
        transition: all 0.2s ease;
    }

    .editable:hover {
        background: #f1f2f6;
    }

    .editable input,
    .editable select,
    .editable textarea {
        width: 100%;
        padding: 8px 12px;
        border: 2px solid #C6FF3D;
        border-radius: 8px;
        font-size: 14px;
        min-width: auto;
    }

    .editable textarea {
        min-height: 80px;
        resize: vertical;
    }

    .criticality {
        display: inline-block;
        padding: 6px 14px;
        border-radius: 20px;
        font-weight: 700;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .criticality-low {
        background: #d1fae5;
        color: #065f46;
    }

    .criticality-medium {
        background: #fef3c7;
        color: #92400e;
    }

    .criticality-high {
        background: #fed7d7;
        color: #991b1b;
    }

    .criticality-critical {
        background: #ff4757;
        color: white;
    }

    .actions-cell {
        text-align: center;
        white-space: nowrap;
    }

    /* Modal */
    .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(8px);
        z-index: 1000;
        animation: fadeIn 0.3s ease;
    }

    .modal-overlay.active {
        display: flex;
        align-items: center;
        justify-content: center;
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    .modal {
        background: white;
        border-radius: 20px;
        box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        width: 90%;
        max-width: 900px;
        max-height: 90vh;
        overflow-y: auto;
        animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
        from {
            opacity: 0;
            transform: translateY(100px) scale(0.9);
        }
        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    .modal-header {
        padding: 30px;
        border-bottom: 2px solid #f1f3f5;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #1A1A1D;
        color: white;
        border-radius: 20px 20px 0 0;
    }

    .modal-header h2 {
        font-size: 24px;
        font-weight: 700;
    }

    .close-btn {
        background: rgba(255,255,255,0.2);
        border: none;
        font-size: 28px;
        color: white;
        cursor: pointer;
        padding: 0;
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
        transition: all 0.2s ease;
    }

    .close-btn:hover {
        background: rgba(255,255,255,0.3);
        transform: rotate(90deg);
    }

    .modal-body {
        padding: 30px;
    }

    .form-group {
        margin-bottom: 24px;
    }

    .form-group label {
        display: block;
        margin-bottom: 10px;
        font-weight: 600;
        color: #1A1A1D;
        font-size: 14px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
        width: 100%;
        padding: 12px 16px;
        border: 2px solid #e9ecef;
        border-radius: 10px;
        font-size: 14px;
        font-family: inherit;
        transition: all 0.3s ease;
    }

    .form-group textarea {
        resize: vertical;
        min-height: 100px;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
        outline: none;
        border-color: #C6FF3D;
        box-shadow: 0 0 0 3px rgba(198, 255, 61, 0.1);
    }

    .steps-container {
        margin-top: 20px;
    }

    .step-item {
        background: #f8f9fa;
        padding: 24px;
        border-radius: 12px;
        margin-bottom: 20px;
        border: 2px solid #dee2e6;
        transition: all 0.3s ease;
    }

    .step-item:hover {
        border-color: #C6FF3D;
        box-shadow: 0 4px 12px rgba(198, 255, 61, 0.15);
    }

    .step-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }

    .step-number {
        font-weight: 700;
        background: #1A1A1D;
        color: white;
        padding: 8px 16px;
        border-radius: 20px;
        font-size: 14px;
    }

    .btn-remove {
        background: #ff4757;
        color: white;
        padding: 8px 16px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        transition: all 0.2s ease;
    }

    .btn-remove:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(255, 71, 87, 0.4);
    }

    .btn-add-step {
        width: 100%;
        padding: 16px;
        background: #f1f2f6;
        border: 2px dashed #C6FF3D;
        border-radius: 12px;
        color: #1A1A1D;
        cursor: pointer;
        font-weight: 700;
        font-size: 14px;
        transition: all 0.3s ease;
    }

    .btn-add-step:hover {
        background: #e3e5e8;
        border-color: #b5e630;
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(198, 255, 61, 0.2);
    }

    .modal-footer {
        padding: 20px 30px;
        border-top: 2px solid #f1f3f5;
        display: flex;
        gap: 12px;
        justify-content: flex-end;
        background: #f8f9fa;
        border-radius: 0 0 20px 20px;
    }

    .empty-state {
        text-align: center;
        padding: 80px 20px;
        color: #6c757d;
    }

    .empty-state-icon {
        font-size: 80px;
        margin-bottom: 20px;
        opacity: 0.3;
    }

    .empty-state p {
        font-size: 16px;
        color: #6c757d;
    }

    .dropdown {
        position: relative;
        display: inline-block;
    }

    .dropdown-content {
        display: none;
        position: absolute;
        background-color: white;
        min-width: 220px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        border-radius: 12px;
        z-index: 1;
        overflow: hidden;
        border: 1px solid #e9ecef;
        top: 100%;
        right: 0;
        margin-top: 8px;
    }

    .dropdown-content.show {
        display: block;
    }

    .dropdown-item {
        padding: 12px 20px;
        cursor: pointer;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 14px;
        color: #495057;
        border: none;
        background: none;
        width: 100%;
        text-align: left;
        font-weight: 500;
    }

    .dropdown-item:hover {
        background: #f1f2f6;
        color: #1A1A1D;
    }

    @media (max-width: 768px) {
        .container {
            padding: 15px;
        }

        .controls {
            padding: 20px;
        }

        .controls-row {
            flex-direction: column;
            align-items: stretch;
        }

        .controls-left {
            flex-direction: column;
        }

        input[type="text"],
        select {
            width: 100%;
            min-width: auto;
        }

        .modal {
            width: 95%;
            max-height: 95vh;
            border-radius: 16px;
        }

        .modal-body {
            padding: 20px;
        }

        table {
            font-size: 12px;
        }

        th, td {
            padding: 12px 10px;
        }

        .step-row td:first-child {
            padding-left: 30px;
        }

        .step-row td:first-child::before {
            left: 15px;
        }
    }
</style>
</head>
<body>
    <div class="header">
    </div>

    <div class="container">
        <div class="controls">
            <div class="controls-row">
                <div class="controls-left">
                    <button class="btn btn-primary" id="addScenarioBtn" onclick="openModal()">
                        <span>➕</span> Добавить сценарий
                    </button>
                    <div class="input-group">
                        <input type="text" id="searchInput" placeholder="🔍 Поиск по сценарию..." oninput="applyFilters()">
                        <select id="teamFilter" onchange="applyFilters()">
                            <option value="">Все команды</option>
                        </select>
                    </div>
                </div>
                <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                    <div class="dropdown">
                        <button class="btn btn-success" onclick="toggleExportDropdown()">
                            <span>📥</span> Экспорт
                        </button>
                        <div id="exportDropdown" class="dropdown-content">
                            <button class="dropdown-item" onclick="saveToFile()">
                                <span>💾</span> Скачать JSON
                            </button>
                            <button class="dropdown-item" onclick="exportToCSV()">
                                <span>📊</span> Экспорт в CSV
                            </button>
                        </div>
                    </div>
                    <div class="dropdown">
                        <button class="btn btn-secondary" onclick="toggleImportDropdown()">
                            <span>📂</span> Импорт
                        </button>
                        <div id="importDropdown" class="dropdown-content">
                            <button class="dropdown-item" onclick="document.getElementById('fileInput').click()">
                                <span>📄</span> Загрузить JSON
                            </button>
                            <button class="dropdown-item" onclick="document.getElementById('csvInput').click()">
                                <span>📊</span> Импорт из CSV
                            </button>
                        </div>
                    </div>
                    <input type="file" id="fileInput" accept=".json" style="display: none;" onchange="loadFromFile(event)">
                    <input type="file" id="csvInput" accept=".csv" style="display: none;" onchange="importFromCSV(event)">
                </div>
            </div>
        </div>

        <div class="table-container">
            <div class="table-wrapper">
                <table id="risksTable">
                    <thead>
                        <tr>
                            <th>Сценарий / Шаг пользователя</th>
                            <th>Участвующие команды</th>
                            <th>Критичность</th>
                            <th>Основной риск</th>
                            <th style="width: 100px;">R</th>
                            <th style="width: 100px;">A</th>
                            <th style="width: 140px;" id="actionsHeader">Действия</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="7">
                                <div class="empty-state">
                                    <div class="empty-state-icon">📋</div>
                                    <p>Нет данных. Добавьте первый сценарий.</p>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Добавить сценарий</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Название сценария *</label>
                    <input type="text" id="scenarioName" placeholder="Например: Регистрация пользователя">
                </div>

                <div class="steps-container">
                    <label style="display: block; margin-bottom: 12px; font-weight: 600; color: #2d3748;">Шаги сценария</label>
                    <div id="stepsContainer"></div>
                    <button class="btn-add-step" onclick="addStep()">➕ Добавить шаг</button>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal()">Отмена</button>
                <button class="btn btn-success" onclick="saveScenario()">💾 Сохранить сценарий</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>

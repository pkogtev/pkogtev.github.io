<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Матрица рисков</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Основные стили -->
    <style>
        body {
            margin: 0;
            background: #f5f7fa;
            font-family: "Inter", sans-serif;
            color: #1a1a1a;
        }

        header {
            display: flex;
            align-items: center;
            padding: 20px 28px;
            font-size: 32px;
            font-weight: 700;
            gap: 12px;
        }

        header img {
            width: 32px;
        }

        .container {
            padding: 20px 28px;
        }

        /* ───── Кнопки ───── */

        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
        }

        .btn {
            background: #e9eef8;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }

        .btn:hover {
            background: #d7e2f5;
        }

        .btn-primary {
            background: #0066ff;
            color: white;
        }

        .btn-primary:hover {
            background: #0051d6;
        }

        .btn-danger {
            background: #ffe5e5;
            color: #b60000;
        }

        /* ───── Таблица ───── */

        table {
            width: 100%;
            background: white;
            border-radius: 14px;
            overflow: hidden;
            border-collapse: separate;
            border-spacing: 0;
        }

        th, td {
            padding: 14px 18px;
            text-align: left;
            vertical-align: middle;
        }

        th {
            background: #e7f0ff;
            font-size: 14px;
            font-weight: 600;
            color: #2b3a55;
        }

        tr:nth-child(even) td {
            background: #fafbff;
        }

        tr:hover td {
            background: #eef3ff;
        }

        .editable {
            cursor: pointer;
        }

        .editable-input {
            width: 100%;
            padding: 6px;
            font-size: 14px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        /* ───── Severity ───── */

        .severity-badge {
            padding: 4px 10px;
            border-radius: 8px;
            font-weight: 600;
            display: inline-block;
        }
        .severity-low { background: #eafbea; color: #218c21; }
        .severity-medium { background: #fff5d9; color: #d5a100; }
        .severity-high { background: #ffe3d9; color: #d54b00; }
        .severity-critical { background: #ffd4d4; color: #c30000; }

        /* ───── Кнопка удалить ───── */

        .btn-delete {
            background: white;
            border: 2px solid #222;
            border-radius: 10px;
            padding: 4px 6px;
            cursor: pointer;
        }

        .btn-delete:hover {
            background: #ffeaea;
            border-color: #ff3a3a;
        }

        /* ───── Модалка ───── */

        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.45);
            display: none;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 16px;
            width: 560px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.25);
        }

        .modal-header {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 26px;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        /* Popup подтверждения удаления */
        #confirmPopup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 24px;
            border-radius: 14px;
            display: none;
            box-shadow: 0 8px 40px rgba(0,0,0,0.25);
        }
        #confirmPopup.active {
            display: block;
        }
    </style>
</head>

<body>

<header>
    <img src="https://img.icons8.com/color/48/combo-chart.png">
    Матрица рисков
</header>

<div class="container">

    <div class="btn-group">
        <button class="btn" onclick="syncWithGitHub()">🔄 Синхронизировать</button>
        <button class="btn-primary" onclick="openModal()">＋ Добавить риск</button>
        <button class="btn" onclick="saveToJSON()">💾 Экспорт JSON</button>

        <button class="btn" id="loadJSONBtn">📂 Импорт JSON</button>
        <input type="file" id="fileInput" accept="application/json" style="display:none">

        <button class="btn-danger btn" onclick="deleteSelected()">🗑 Массовое удаление</button>
    </div>

    <!-- Таблица -->
    <table>
        <thead>
        <tr>
            <th><input type="checkbox" onclick="toggleSelectAll(this)"></th>
            <th>ШАГ</th>
            <th>КОМАНДЫ</th>
            <th>ОСНОВНОЙ РИСК</th>
            <th>R</th>
            <th>A</th>
            <th>ВЕРОЯТН.</th>
            <th>ВЛИЯНИЕ</th>
            <th>КРИТИЧНОСТЬ</th>
            <th>ДЕЙСТВИЯ</th>
        </tr>
        </thead>

        <tbody id="risksTableBody"></tbody>
    </table>

</div>

<!-- Модалка -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalOnOverlay(event)">
    <div class="modal" onclick="event.stopPropagation()">

        <div class="modal-header">
            <span>Добавить риск</span>
            <button class="close-btn" onclick="closeModal()">&times;</button>
        </div>

        <form id="riskForm" onsubmit="addRisk(event)">
            <div class="form-group">
                <label>Название сценария</label>
                <input type="text" id="scenarioName" required>
            </div>

            <div id="stepsContainer"></div>

            <button type="button" class="btn" onclick="addStep()">＋ Добавить шаг</button>

            <br><br>
            <button type="submit" class="btn-primary">Сохранить</button>
        </form>

    </div>
</div>

<!-- Popup подтверждения удаления -->
<div id="confirmPopup">
    <p style="font-size:16px; font-weight:600; margin-bottom:16px;">
        Удалить этот риск?
    </p>

    <button class="btn-danger btn" onclick="confirmDelete()">Удалить</button>
    <button class="btn" onclick="closeConfirm()">Отмена</button>
</div>

<!-- Скрипт -->
<script src="script.js"></script>

</body>
</html>

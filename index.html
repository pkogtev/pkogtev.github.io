<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Матрица рисков</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f0f4f8;
            color: #333333;
            line-height: 1.6;
        }

        .header {
            background: linear-gradient(135deg, #a8d8ea 0%, #aa96da 100%);
            color: #4a4a4a;
            padding: 40px 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.2) 0%, transparent 70%);
            animation: pulse 15s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: translate(0, 0) scale(1);
                opacity: 0.3;
            }
            50% {
                transform: translate(10%, 10%) scale(1.1);
                opacity: 0.5;
            }
        }

        .header-content {
            position: relative;
            z-index: 1;
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .header-icon {
            font-size: 56px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-8px);
            }
        }

        .header h1 {
            font-size: 36px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #2c3e50;
        }

        .header-subtitle {
            font-size: 15px;
            opacity: 0.8;
            margin-top: 8px;
            font-weight: 400;
            color: #34495e;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 30px;
        }

        .controls {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            margin-bottom: 25px;
            border: 1px solid #e2e8f0;
        }

        .controls-row {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: space-between;
        }

        .controls-left {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            flex: 1;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #a8d8ea 0%, #aa96da 100%);
            color: #2c3e50;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(168, 216, 234, 0.3);
        }

        .btn-success {
            background: linear-gradient(135deg, #d4f1f4 0%, #a8e8e5 100%);
            color: #2c3e50;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(212, 241, 244, 0.3);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #f0e6f6 0%, #d9d0e6 100%);
            color: #2c3e50;
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(240, 230, 246, 0.3);
        }

        .btn-danger {
            background: linear-gradient(135deg, #f8c4d0 0%, #f4a6b4 100%);
            color: #2c3e50;
            padding: 8px 16px;
            font-size: 13px;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(248, 196, 208, 0.3);
        }

        .btn-edit {
            background: linear-gradient(135deg, #fce3ce 0%, #f9d5b3 100%);
            color: #2c3e50;
            padding: 8px 16px;
            font-size: 13px;
            margin-right: 5px;
        }

        .btn-edit:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(252, 227, 206, 0.3);
        }

        .input-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        input[type="text"],
        input[type="number"],
        select,
        textarea {
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
            min-width: 200px;
            background: white;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #a8d8ea;
            box-shadow: 0 0 0 3px rgba(168, 216, 234, 0.2);
        }

        .table-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        thead {
            background: linear-gradient(135deg, #d6e4f0 0%, #c3d3e8 100%);
            color: #2c3e50;
        }

        th {
            padding: 18px 16px;
            text-align: left;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            border-bottom: 2px solid rgba(255,255,255,0.3);
        }

        td {
            padding: 16px;
            border-bottom: 1px solid #edf2f7;
            font-size: 14px;
            color: #4a5568;
        }

        tbody tr {
            transition: all 0.2s ease;
        }

        tbody tr:hover {
            background: #f8fafc;
            transform: scale(1.001);
        }

        .scenario-row {
            background: linear-gradient(135deg, #f0f4f8 0%, #e2e8f0 100%);
            font-weight: 700;
            color: #2d3748;
        }

        .scenario-row td {
            padding: 16px;
            font-size: 15px;
            border-bottom: 2px solid #cbd5e0;
        }

        .scenario-row:hover {
            background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e0 100%);
        }

        .step-row td:first-child {
            padding-left: 50px;
            position: relative;
        }

        .step-row td:first-child::before {
            content: '└';
            position: absolute;
            left: 30px;
            color: #a0aec0;
            font-weight: bold;
        }

        .editable {
            cursor: pointer;
            position: relative;
            min-height: 20px;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .editable:hover {
            background: linear-gradient(135deg, #f0f9ff 0%, #e6f4ff 100%);
        }

        .editable input,
        .editable select,
        .editable textarea {
            width: 100%;
            padding: 8px 12px;
            border: 2px solid #a8d8ea;
            border-radius: 8px;
            font-size: 14px;
            min-width: auto;
        }

        .editable textarea {
            min-height: 80px;
            resize: vertical;
        }

        .criticality {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .criticality-low {
            background: linear-gradient(135deg, #d1fae5 0%, #a7f3d0 100%);
            color: #065f46;
        }

        .criticality-medium {
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            color: #92400e;
        }

        .criticality-high {
            background: linear-gradient(135deg, #fed7d7 0%, #fca5a5 100%);
            color: #991b1b;
        }

        .criticality-critical {
            background: linear-gradient(135deg, #fbcfe8 0%, #f9a8d4 100%);
            color: #9d174d;
        }

        .actions-cell {
            text-align: center;
            white-space: nowrap;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal {
            background: white;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.2);
            width: 90%;
            max-width: 900px;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(100px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal-header {
            padding: 30px;
            border-bottom: 2px solid #edf2f7;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, #d6e4f0 0%, #c3d3e8 100%);
            color: #2c3e50;
            border-radius: 20px 20px 0 0;
        }

        .modal-header h2 {
            font-size: 24px;
            font-weight: 700;
        }

        .close-btn {
            background: rgba(255,255,255,0.3);
            border: none;
            font-size: 28px;
            color: #2c3e50;
            cursor: pointer;
            padding: 0;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            transition: all 0.2s ease;
        }

        .close-btn:hover {
            background: rgba(255,255,255,0.5);
            transform: rotate(90deg);
        }

        .modal-body {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #2d3748;
            font-size: 14px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #a8d8ea;
            box-shadow: 0 0 0 3px rgba(168, 216, 234, 0.2);
        }

        .steps-container {
            margin-top: 20px;
        }

        .step-item {
            background: linear-gradient(135deg, #f8fafc 0%, #edf2f7 100%);
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 2px solid #e2e8f0;
            transition: all 0.3s ease;
        }

        .step-item:hover {
            border-color: #a8d8ea;
            box-shadow: 0 4px 12px rgba(168, 216, 234, 0.1);
        }

        .step-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .step-number {
            font-weight: 700;
            background: linear-gradient(135deg, #a8d8ea 0%, #aa96da 100%);
            color: #2c3e50;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
        }

        .btn-remove {
            background: linear-gradient(135deg, #f8c4d0 0%, #f4a6b4 100%);
            color: #2c3e50;
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-remove:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(248, 196, 208, 0.3);
        }

        .btn-add-step {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            border: 2px dashed #a8d8ea;
            border-radius: 12px;
            color: #2c3e50;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .btn-add-step:hover {
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            border-color: #78c5e7;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(168, 216, 234, 0.2);
        }

        .modal-footer {
            padding: 20px 30px;
            border-top: 2px solid #edf2f7;
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            background: #f8fafc;
            border-radius: 0 0 20px 20px;
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #718096;
        }

        .empty-state-icon {
            font-size: 80px;
            margin-bottom: 20px;
            opacity: 0.4;
        }

        .empty-state p {
            font-size: 16px;
            color: #718096;
        }

        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: white;
            min-width: 220px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            border-radius: 12px;
            z-index: 1;
            overflow: hidden;
            border: 1px solid #e2e8f0;
            top: 100%;
            right: 0;
            margin-top: 8px;
        }

        .dropdown-content.show {
            display: block;
        }

        .dropdown-item {
            padding: 12px 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #4a5568;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            font-weight: 500;
        }

        .dropdown-item:hover {
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            color: #2c3e50;
        }

        @media (max-width: 768px) {
            .header {
                padding: 30px 20px;
            }

            .header h1 {
                font-size: 28px;
            }

            .header-icon {
                font-size: 40px;
            }

            .container {
                padding: 15px;
            }

            .controls {
                padding: 20px;
            }

            .controls-row {
                flex-direction: column;
                align-items: stretch;
            }

            .controls-left {
                flex-direction: column;
            }

            input[type="text"],
            select {
                width: 100%;
                min-width: auto;
            }

            .modal {
                width: 95%;
                max-height: 95vh;
                border-radius: 16px;
            }

            .modal-body {
                padding: 20px;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 12px 10px;
            }

            .step-row td:first-child {
                padding-left: 30px;
            }

            .step-row td:first-child::before {
                left: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <div class="header-icon">🎯</div>
            <div>
                <h1>Матрица рисков</h1>
                <div class="header-subtitle">Управление и контроль рисков проекта</div>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="controls">
            <div class="controls-row">
                <div class="controls-left">
                    <button class="btn btn-primary" id="addScenarioBtn" onclick="openModal()">
                        <span>➕</span> Добавить сценарий
                    </button>
                    <div class="input-group">
                        <input type="text" id="searchInput" placeholder="🔍 Поиск по сценарию..." oninput="applyFilters()">
                        <select id="teamFilter" onchange="applyFilters()">
                            <option value="">Все команды</option>
                        </select>
                    </div>
                </div>
                <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                    <div class="dropdown">
                        <button class="btn btn-success" onclick="toggleExportDropdown()">
                            <span>📥</span> Экспорт
                        </button>
                        <div id="exportDropdown" class="dropdown-content">
                            <button class="dropdown-item" onclick="saveToFile()">
                                <span>💾</span> Скачать JSON
                            </button>
                            <button class="dropdown-item" onclick="exportToCSV()">
                                <span>📊</span> Экспорт в CSV
                            </button>
                        </div>
                    </div>
                    <div class="dropdown">
                        <button class="btn btn-secondary" onclick="toggleImportDropdown()">
                            <span>📂</span> Импорт
                        </button>
                        <div id="importDropdown" class="dropdown-content">
                            <button class="dropdown-item" onclick="document.getElementById('fileInput').click()">
                                <span>📄</span> Загрузить JSON
                            </button>
                            <button class="dropdown-item" onclick="document.getElementById('csvInput').click()">
                                <span>📊</span> Импорт из CSV
                            </button>
                        </div>
                    </div>
                    <input type="file" id="fileInput" accept=".json" style="display: none;" onchange="loadFromFile(event)">
                    <input type="file" id="csvInput" accept=".csv" style="display: none;" onchange="importFromCSV(event)">
                </div>
            </div>
        </div>

        <div class="table-container">
            <div class="table-wrapper">
                <table id="risksTable">
                    <thead>
                        <tr>
                            <th>Сценарий / Шаг пользователя</th>
                            <th>Участвующие команды</th>
                            <th>Критичность</th>
                            <th>Основной риск</th>
                            <th style="width: 100px;">R</th>
                            <th style="width: 100px;">A</th>
                            <th style="width: 140px;" id="actionsHeader">Действия</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="7">
                                <div class="empty-state">
                                    <div class="empty-state-icon">📋</div>
                                    <p>Нет данных. Добавьте первый сценарий.</p>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Добавить сценарий</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Название сценария *</label>
                    <input type="text" id="scenarioName" placeholder="Например: Регистрация пользователя">
                </div>

                <div class="steps-container">
                    <label style="display: block; margin-bottom: 12px; font-weight: 600; color: #2d3748;">Шаги сценария</label>
                    <div id="stepsContainer"></div>
                    <button class="btn-add-step" onclick="addStep()">➕ Добавить шаг</button>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal()">Отмена</button>
                <button class="btn btn-success" onclick="saveScenario()">💾 Сохранить сценарий</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>

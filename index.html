<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Матрица рисков</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f8f9fa;
            color: #212529;
            line-height: 1.6;
        }

        /* HEADER – pastel colors */
        .header {
            background: #e8edf3;
            color: #4a4a4a;
            padding: 50px 30px;
            position: relative;
        }

        .header::before,
        .header::after {
            display: none;
        }

        .header-content {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .header-icon {
            font-size: 56px;
        }

        .header h1 {
            font-size: 42px;
            font-weight: 800;
            background: none;
            -webkit-text-fill-color: #4a4a4a;
        }

        .header-subtitle {
            font-size: 15px;
            color: #7d8a99;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 30px;
        }

        /* CONTROLS */
        .controls {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            margin-bottom: 25px;
            border: 1px solid #e9ecef;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        /* BUTTONS — pastel */
        .btn-primary {
            background: #cfdaf2;
            color: #3a3a3a;
        }

        .btn-primary:hover {
            box-shadow: 0 4px 10px rgba(180, 190, 220, 0.6);
        }

        .btn-success {
            background: #d7f2e3;
            color: #3a4f46;
        }

        .btn-success:hover {
            box-shadow: 0 4px 10px rgba(150, 200, 170, 0.6);
        }

        .btn-secondary {
            background: #d9e7f2;
            color: #3a4a5a;
        }

        .btn-secondary:hover {
            box-shadow: 0 4px 10px rgba(170, 190, 210, 0.6);
        }

        .btn-danger {
            background: #f6d1d1;
            color: #7a3a3a;
            padding: 8px 16px;
        }

        .btn-edit {
            background: #f3d9f2;
            color: #6a4a6a;
            padding: 8px 16px;
        }

        /* TABLE HEADER – pastel */
        thead {
            background: #e8edf3;
            color: #4a4a4a;
        }

        th {
            padding: 18px 16px;
            text-align: left;
            font-size: 13px;
            text-transform: uppercase;
            border-bottom: 3px solid rgba(0,0,0,0.05);
        }

        td {
            padding: 16px;
            border-bottom: 1px solid #f1f3f5;
            font-size: 14px;
            color: #495057;
        }

        /* SCENARIO ROWS – pastel */
        .scenario-row {
            background: #f1f3f5;
            color: #4a4a4a;
        }

        .scenario-row:hover {
            background: #e4e7ea;
        }

        /* Editable hover */
        .editable:hover {
            background: #f4f1fa;
        }

        /* CRITICALITY TAGS – pastel */
        .criticality {
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 12px;
        }

        .criticality-low {
            background: #e7f8e3;
            color: #3c553a;
        }

        .criticality-medium {
            background: #ffeedd;
            color: #6d4b3a;
        }

        .criticality-high {
            background: #ffdede;
            color: #6a3a3a;
        }

        .criticality-critical {
            background: #f0bcbc;
            color: #5e1f1f;
        }

        /* MODAL – pastel */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal {
            background: white;
            border-radius: 20px;
            width: 90%;
            max-width: 900px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            padding: 30px;
            background: #e8edf3;
            color: #4a4a4a;
            border-radius: 20px 20px 0 0;
        }

        .modal-body {
            padding: 30px;
        }

        .step-item {
            background: #f5f7fa;
            border: 2px solid #e1e5ea;
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .step-item:hover {
            border-color: #c8d1df;
        }

        .step-number {
            background: #dcdff2;
            color: #4a4a4a;
            padding: 8px 16px;
            border-radius: 20px;
        }

        .btn-add-step {
            width: 100%;
            padding: 16px;
            background: #f4f1fa;
            border: 2px dashed #d3cdea;
            border-radius: 12px;
            color: #6a5a92;
            cursor: pointer;
        }

        .btn-add-step:hover {
            background: #ece8f5;
            border-color: #b9b2d4;
        }

        .modal-footer {
            padding: 20px 30px;
            background: #f8f9fa;
            border-radius: 0 0 20px 20px;
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <div class="header-icon">🎯</div>
            <div>
                <h1>Матрица рисков</h1>
                <div class="header-subtitle">Управление и контроль рисков проекта</div>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="controls">
            <div class="controls-row">
                <div class="controls-left">
                    <button class="btn btn-primary" id="addScenarioBtn" onclick="openModal()">
                        <span>➕</span> Добавить сценарий
                    </button>
                    <div class="input-group">
                        <input type="text" id="searchInput" placeholder="🔍 Поиск по сценарию..." oninput="applyFilters()">
                        <select id="teamFilter" onchange="applyFilters()">
                            <option value="">Все команды</option>
                        </select>
                    </div>
                </div>
                <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                    <div class="dropdown">
                        <button class="btn btn-success" onclick="toggleExportDropdown()">
                            <span>📥</span> Экспорт
                        </button>
                        <div id="exportDropdown" class="dropdown-content">
                            <button class="dropdown-item" onclick="saveToFile()">
                                <span>💾</span> Скачать JSON
                            </button>
                            <button class="dropdown-item" onclick="exportToCSV()">
                                <span>📊</span> Экспорт в CSV
                            </button>
                        </div>
                    </div>
                    <div class="dropdown">
                        <button class="btn btn-secondary" onclick="toggleImportDropdown()">
                            <span>📂</span> Импорт
                        </button>
                        <div id="importDropdown" class="dropdown-content">
                            <button class="dropdown-item" onclick="document.getElementById('fileInput').click()">
                                <span>📄</span> Загрузить JSON
                            </button>
                            <button class="dropdown-item" onclick="document.getElementById('csvInput').click()">
                                <span>📊</span> Импорт из CSV
                            </button>
                        </div>
                    </div>
                    <input type="file" id="fileInput" accept=".json" style="display: none;" onchange="loadFromFile(event)">
                    <input type="file" id="csvInput" accept=".csv" style="display: none;" onchange="importFromCSV(event)">
                </div>
            </div>
        </div>

        <div class="table-container">
            <div class="table-wrapper">
                <table id="risksTable">
                    <thead>
                        <tr>
                            <th>Сценарий / Шаг пользователя</th>
                            <th>Участвующие команды</th>
                            <th>Критичность</th>
                            <th>Основной риск</th>
                            <th style="width: 100px;">R</th>
                            <th style="width: 100px;">A</th>
                            <th style="width: 140px;" id="actionsHeader">Действия</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="7">
                                <div class="empty-state">
                                    <div class="empty-state-icon">📋</div>
                                    <p>Нет данных. Добавьте первый сценарий.</p>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Добавить сценарий</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Название сценария *</label>
                    <input type="text" id="scenarioName" placeholder="Например: Регистрация пользователя">
                </div>

                <div class="steps-container">
                    <label style="display: block; margin-bottom: 12px; font-weight: 600; color: #212529;">Шаги сценария</label>
                    <div id="stepsContainer"></div>
                    <button class="btn-add-step" onclick="addStep()">➕ Добавить шаг</button>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal()">Отмена</button>
                <button class="btn btn-success" onclick="saveScenario()">💾 Сохранить сценарий</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>

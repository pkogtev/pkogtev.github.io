<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Матрица рисков</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Yandex Sans Text', Arial, sans-serif;
        background: #fafafa;
        color: #111;
    }
    .header {
        background: #fff;
        padding: 28px 32px;
        border-bottom: 1px solid #e6e6e6;
    }
    .header-content {
        max-width: 1300px;
        margin: 0 auto;
        display: flex;
        gap: 16px;
        align-items: center;
    }
    .header-icon { font-size: 34px; opacity: 0.7; }
    .header h1 { font-size: 28px; font-weight: 600; }
    .header-subtitle { font-size: 14px; margin-top: 4px; color: #555; }

    .container { max-width: 1300px; margin: 0 auto; padding: 24px; }

    .controls {
        background: #fff;
        padding: 18px 20px;
        border-radius: 10px;
        border: 1px solid #e6e6e6;
        margin-bottom: 20px;
    }

    .controls-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
    }

    .btn {
        padding: 9px 14px;
        border-radius: 6px;
        background: #fff;
        border: 1px solid #dcdcdc;
        font-size: 14px;
        cursor: pointer;
        transition: 0.15s;
    }
    .btn:hover { background: #f2f2f2; }

    .btn-primary {
        background: #fff;
        border-color: #b3b3b3;
        font-weight: 600;
    }
    .btn-primary:hover { background: #f0f0f0; }

    input[type="text"], select {
        padding: 10px 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        background: #fff;
        font-size: 14px;
        min-width: 200px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        background: #fff;
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid #e6e6e6;
    }

    th {
        background: #f5f5f5;
        padding: 12px;
        font-size: 13px;
        border-bottom: 1px solid #e6e6e6;
        color: #555;
        text-align: left;
    }

    td {
        padding: 14px;
        border-bottom: 1px solid #f0f0f0;
        font-size: 14px;
    }

    tbody tr:hover { background: #f9f9f9; }

    .scenario-row { background: #f3f3f3; font-weight: 600; }

    .criticality {
        padding: 4px 10px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: 600;
        display: inline-block;
    }
    .criticality-low { background: #e8f5e9; color: #2e7d32; }
    .criticality-medium { background: #fff3cd; color: #8a6d3b; }
    .criticality-high { background: #f8d7da; color: #842029; }
    .criticality-critical { background: #c62828; color: #fff; }

    .modal-overlay {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.35);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 2000;
    }
    .modal-overlay.active { display: flex; }

    .modal {
        background: #fff;
        border-radius: 10px;
        width: 90%;
        max-width: 720px;
        padding: 22px;
        border: 1px solid #e6e6e6;
    }

    .modal-header { font-size: 20px; font-weight: 600; margin-bottom: 16px; }

    .form-group { margin-bottom: 16px; }
    .form-group label { font-size: 14px; margin-bottom: 6px; display: block; }
    .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }

    .steps-container { margin-top: 16px; }
    .step-item {
        padding: 14px;
        border-radius: 6px;
        border: 1px solid #e6e6e6;
        background: #fafafa;
        margin-bottom: 10px;
    }

    .btn-add-step {
        width: 100%;
        padding: 10px;
        border-radius: 6px;
        border: 1px solid #ccc;
        background: #fff;
        cursor: pointer;
        font-weight: 600;
    }
    .btn-add-step:hover { background: #f2f2f2; }
</style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <div class="header-icon">📌</div>
            <div>
                <h1>Матрица рисков</h1>
                <div class="header-subtitle">Управление и контроль рисков проекта</div>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="controls">
            <div class="controls-row">
                <button class="btn btn-primary" onclick="openModal()">➕ Добавить сценарий</button>

                <div style="display:flex; gap:10px; flex-wrap:wrap;">
                    <input type="text" id="searchInput" placeholder="Поиск..." oninput="applyFilters()" />
                    <select id="teamFilter" onchange="applyFilters()">
                        <option value="">Все команды</option>
                    </select>
                </div>

                <div style="display:flex; gap:10px; flex-wrap:wrap;">
                    <button class="btn" onclick="saveToFile()">💾 JSON</button>
                    <button class="btn" onclick="exportToCSV()">📊 CSV</button>
                </div>
            </div>
        </div>

        <table id="risksTable">
            <thead>
                <tr>
                    <th>Сценарий / Шаг</th>
                    <th>Команды</th>
                    <th>Критичность</th>
                    <th>Риск</th>
                    <th>R</th>
                    <th>A</th>
                    <th>Действия</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr>
                    <td colspan="7" style="padding:40px; text-align:center; color:#777;">Нет данных. Добавьте первый сценарий.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header" id="modalTitle">Добавить сценарий</div>

            <div class="form-group">
                <label>Название сценария</label>
                <input type="text" id="scenarioName" />
            </div>

            <div class="steps-container">
                <label>Шаги сценария</label>
                <div id="stepsContainer"></div>
                <button class="btn-add-step" onclick="addStep()">➕ Добавить шаг</button>
            </div>

            <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px;">
                <button class="btn" onclick="closeModal()">Отмена</button>
                <button class="btn btn-primary" onclick="saveScenario()">Сохранить</button>
            </div>
        </div>
    </div>

<script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Матрица рисков</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        font-family: Inter, Arial, sans-serif;
        background: #f5f7fb;
        color: #333;
    }

    h1 {
        padding: 20px 30px;
        margin: 0;
        font-size: 26px;
        font-weight: 700;
    }

    .toolbar {
        display: flex;
        gap: 12px;
        padding: 0 30px 20px;
    }

    .btn {
        padding: 10px 18px;
        border-radius: 10px;
        font-size: 15px;
        border: none;
        cursor: pointer;
        background: #e9eef7;
        color: #444;
        transition: 0.15s;
    }
    .btn:hover { background: #dfe6f2; }

    .btn-primary {
        background: #377dff;
        color: #fff;
        font-weight: 600;
        padding: 12px 22px;
        border-radius: 12px;
    }
    .btn-primary:hover { background: #2f6fe0; }

    table {
        width: 96%;
        margin: 20px auto;
        border-collapse: collapse;
        background: white;
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }

    thead tr {
        background: #eef3fb;
        height: 50px;
    }

    th, td {
        padding: 14px 18px;
        text-align: left;
        border-bottom: 1px solid #eff2f5;
    }

    tbody tr:hover {
        background: #f9fbff;
    }

    .btn-delete {
        background: #e9eef7;
        color: #fff;
        border-radius: 10px;
        border: none;
        padding: 8px 12px;
        cursor: pointer;
        transition: 0.15s;
    }
    .btn-delete:hover { background: #e25555; }

    .severity-badge {
        padding: 6px 10px;
        border-radius: 10px;
        font-weight: 600;
        color: #fff;
    }
    .severity-low { background: #7dc97d; }
    .severity-medium { background: #f5c542; }
    .severity-high { background: #ff8b3d; }
    .severity-critical { background: #ff5252; }

    /* modal */
    #modalOverlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.45);
        display: none;
        justify-content: center;
        align-items: center;
    }

    #modalOverlay.active { display: flex; }

    .modal {
        background: white;
        width: 480px;
        border-radius: 14px;
        padding: 25px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }

    .form-group { margin-bottom: 15px; }
    .form-group label { font-size: 14px; display: block; margin-bottom: 5px; }
    .form-group input {
        width: 100%;
        padding: 10px;
        border-radius: 10px;
        border: 1px solid #d5d9e1;
    }
</style>

</head>
<body>

<h1>Матрица рисков</h1>

<div class="toolbar">
    <button class="btn-primary" onclick="openModal()">+ Добавить риск</button>
    <button class="btn" onclick="saveToJSON()">⬇ Экспорт JSON</button>
    <button class="btn" onclick="document.getElementById('fileInput').click()">⬆ Импорт JSON</button>
    <button class="btn" onclick="deleteSelected()">🗑 Массовое удаление</button>
</div>

<input type="file" id="fileInput" style="display:none">

<table>
    <thead>
        <tr>
            <th style="width:30px"><input type="checkbox" onclick="toggleSelectAll(this)"></th>
            <th>Шаг</th>
            <th>Команды</th>
            <th>Основной риск</th>
            <th>R</th>
            <th>A</th>
            <th>Вероятность</th>
            <th>Влияние</th>
            <th>Критичность</th>
            <th>Действия</th>
        </tr>
    </thead>
    <tbody id="risksTableBody"></tbody>
</table>

<!-- МОДАЛКА -->
<div id="modalOverlay" onclick="closeModalOnOverlay(event)">
    <div class="modal">
        <h2 id="modalTitle">Добавить риск</h2>

        <div class="form-group">
            <label>Шаг</label>
            <input id="mStep">
        </div>

        <div class="form-group">
            <label>Команды</label>
            <input id="mTeams">
        </div>

        <div class="form-group">
            <label>Основной риск</label>
            <input id="mMainRisk">
        </div>

        <div class="form-group">
            <label>R</label>
            <input id="mR">
        </div>

        <div class="form-group">
            <label>A</label>
            <input id="mA">
        </div>

        <div class="form-group">
            <label>Вероятность (1–5)</label>
            <input id="mProb" type="number" min="1" max="5">
        </div>

        <div class="form-group">
            <label>Влияние (1–5)</label>
            <input id="mImpact" type="number" min="1" max="5">
        </div>

        <button class="btn-primary" onclick="saveRisk()">Сохранить</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
